<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="100%" height="100%">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7C844" />
      <stop offset="35%" stop-color="#EAA816" />
      <stop offset="70%" stop-color="#D79007" />
      <stop offset="100%" stop-color="#ECA918" />
    </linearGradient>
    <clipPath id="favTopClip">
      <path d="M 12,8 L 52,8 C 66,8 74,16 74,26 C 74,36 66,42 52,42 L 12,42 Z" />
    </clipPath>
  </defs>

  <!-- Left Vertical Spine -->
  <rect x="10" y="8" width="12" height="64" rx="3.5" fill="url(#favGold)" />

  <!-- Top Bowl with 45-degree Diagonal Hatch Stripes -->
  <g clip-path="url(#favTopClip)">
    <line x1="10" y1="22" x2="38" y2="-6" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round" />
    <line x1="20" y1="34" x2="52" y2="2" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round" />
    <line x1="32" y1="46" x2="66" y2="12" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round" />
    <line x1="46" y1="56" x2="80" y2="22" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round" />
    <line x1="60" y1="66" x2="92" y2="34" stroke="url(#favGold)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Bottom Bowl: Clean Hollow Contour -->
  <path
    d="M 12,42 L 53,42 C 67,42 76,49 76,59 C 76,68 67,72 53,72 L 12,72"
    fill="none"
    stroke="url(#favGold)"
    stroke-width="8"
    stroke-linejoin="round"
    stroke-linecap="round"
  />
</svg>
